summary_no: "Du arbeider på boredekket og rørdekket, skrur sammen og fra hverandre borestrengen og håndterer utstyr i et lag på fire til seks personer under borerens ledelse."
summary_en: "You work on the drill floor and pipe deck, make up and break out the drill string and handle equipment in a team of four to six under the driller."
rotation_no: "Oppstart 28. oktober 2028 · hele vintersesongen"
rotation_en: "Start 28 October 2028 · full winter season"
requirements_no: |-
  Gyldige sikkerhetskurs for offshore (BOSIET med EBS eller tilsvarende) og offshore helseattest
  God fysisk form til tungt arbeid i kulde og vær
  Kan signere på for hele vintersesongen
  Engelsk er et krav, norsk er en fordel
requirements_en: |-
  Valid offshore safety certificates (BOSIET with EBS or equivalent) and an offshore medical certificate
  Physically fit for heavy work in cold and wet conditions
  Able to sign on for the full winter season
  English required, Norwegian an advantage

title_no: "Driller"
title_en: "Driller"
subtitle_no: "Borer"
subtitle_en: "Drill floor lead"
summary_no: "Du leder arbeidet på boredekket, betjener boreutstyret og har sammen med boresjefen ansvar for brønnkontroll og sikker gjennomføring av hver operasjon."
summary_en: "You lead the drill floor, operate the drilling equipment and, together with the toolpusher, are responsible for well control and the safe execution of every operation."
rotation_no: "Oppstart 28. oktober 2028 · hele vintersesongen"
rotation_en: "Start 28 October 2028 · full winter season"
requirements_no: |-
  Gyldig brønnkontrollsertifikat på operatørnivå (IWCF eller IADC WellSharp)
  Gyldige sikkerhetskurs for offshore (BOSIET med EBS eller tilsvarende) og offshore helseattest
  Evne til å lede et lite lag under press
  Engelsk er et krav, norsk er en fordel
requirements_en: |-
  Valid well control certificate at driller level (IWCF or IADC WellSharp)
  Valid offshore safety certificates (BOSIET with EBS or equivalent) and an offshore medical certificate
  Able to lead a small crew under pressure
  English required, Norwegian an advantage

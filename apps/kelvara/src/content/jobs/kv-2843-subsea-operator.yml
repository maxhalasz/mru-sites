reference: "KV-2843"
date: "2028-10-15"
published: true
order: 3
location: "Ødemark A"
title_no: "Subsea Operator"
title_en: "Subsea Operator"
subtitle_no: "Subsea-operatør"
subtitle_en: "Subsea production and ROV support"
summary_no: "Du betjener og vedlikeholder undervannsutstyr på feltet: brønnhoder, rammer og ventiler. Du følger ROV-operasjoner fra kontrollrommet og på dekk."
summary_en: "You operate and maintain the subsea equipment on the field: wellheads, templates and valves. You follow ROV operations from the control room and on deck."
rotation_no: "Oppstart 1. november 2028 · hele vintersesongen"
rotation_en: "Start 1 November 2028 · full winter season"
requirements_no: |-
  Fagbrev eller utdanning innen mekanikk, elektro eller automasjon
  Minst to års erfaring fra subsea-drift eller ROV
  Gyldige sikkerhetskurs for offshore (BOSIET med EBS eller tilsvarende) og offshore helseattest
  God forståelse av hydrauliske og elektriske kontrollsystemer
  Engelsk er et krav, norsk er en fordel
requirements_en: |-
  Trade certificate or degree in mechanical, electrical or instrumentation engineering
  At least two years in subsea operations or ROV work
  Valid offshore safety certificates (BOSIET with EBS or equivalent) and an offshore medical certificate
  Good understanding of hydraulic and electrical control systems
  English required, Norwegian an advantage

name: "Gunnar MacKenzie"
order: 1
published: true
role_no: "Plattformsjef, Ødemark A"
role_en: "Platform Supervisor, Ødemark A"
quote_no: "Jeg har tilbrakt det meste av yrkeslivet i Nordsjøen, og Ødemark A er den eldste installasjonen jeg har drevet. Man må ha respekt for en plattform som denne. Jobben min er lett å forklare: alle skal komme hjem etter rotasjonen på samme måte som de reiste ut. Vi er et lite mannskap, og ingen tar snarveier på min plattform. Kelvara ga meg muligheten til å drive Ødemark A på min måte, og det tar jeg ikke for gitt."
quote_en: "I've spent most of my working life in the North Sea, and Ødemark A is the oldest installation I've run. You have to respect a platform like this. My job is easy to explain: everybody goes home at the end of the rotation the same way they came out. We're a small crew, and nobody takes shortcuts on my platform. Kelvara gave me the chance to run Ødemark A my way, and I don't take that for granted."

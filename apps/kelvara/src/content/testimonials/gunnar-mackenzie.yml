name: "Gunnar MacKenzie"
order: 1
published: true
role_no: "Plattformsjef, Ødemark A"
role_en: "Platform Supervisor, Ødemark A"
quote_no: "Det meste av yrkeslivet mitt har vært i Nordsjøen. Ødemark A er den eldste installasjonen jeg har ledet, og den har sine vaner. Dem lærer man seg. Jobben er å få alle hjem etter rotasjonen i samme stand som de reiste ut. Vi er et lite mannskap, jeg kjenner dem alle ved navn, og jeg ser som regel hvem som ikke har sovet. Her tar ingen snarveier. Kelvara lot meg drive plattformen på min måte, og så langt har ingen bedt meg endre det."
quote_en: "Most of my working life has been in the North Sea. Ødemark A is the oldest installation I have run, and she has her habits. You learn them. The job is to get everybody home at the end of the rotation in the same shape they left. It is a small crew, I know them all by name, and I can usually tell who did not sleep. Nobody takes shortcuts here. Kelvara let me run the platform my way, and so far nobody has asked me to change that."

name: "Gunnar MacKenzie"
order: 1
published: true
role_no: "Plattformsjef, Ødemark A"
role_en: "Platform Supervisor, Ødemark A"
quote_no: "Det meste av yrkeslivet mitt har vært i Nordsjøen. Ødemark A er den eldste installasjonen jeg har ledet, og den har sine vaner. Jobben er å få alle hjem etter rotasjonen i samme stand som de reiste ut. Vi er et lite mannskap, jeg kjenner dem alle ved navn, og jeg ser som regel hvem som ikke har sovet natten før. Alle jobber hardt her. Det beste for meg er å vite at jeg har gjort en god jobb når jeg ser de samme ansiktene igjen i neste rotasjon. Kelvara har gitt meg dette ansvaret, og det er jeg veldig takknemlig for."
quote_en: "Most of my working life has been in the North Sea. Ødemark A is the oldest installation I have run, and she has her habits. The job is to get everybody home at the end of the rotation in the same shape they left. It is a small crew, I know them all by name, and I can usually tell who did not sleep last night. Everyone works real hard here. The best part for me is knowing I did a good job when I see the same faces coming in in the next rotation. Kelvara entrusted me this responsibility, and I am very thankful for that."

name: "Del Carbone"
order: 2
published: true
role_no: "Hovedkokk, Ødemark A"
role_en: "Chief Cook, Ødemark A"
quote_no: "Jeg vokste opp i familiens restaurant, og etterpå har jeg kokkelert på et cruiseskip og på et sykehuskjøkken. Her ute jobber folk tolv timer i kulde og mørke, og utpå ettermiddagen tenker de allerede på middagen. Lørdag er biffkveld. Jeg prøvde å endre på det én gang, og det gjør jeg ikke om igjen. Lunsjen kan være noen minutter forsinket av og til. Ingen har klaget til meg ennå."
quote_en: "I grew up in my family's restaurant, and after that I cooked on a cruise ship and in a hospital kitchen. Out here people work twelve-hour shifts in the cold and the dark, and by mid-afternoon they are already thinking about dinner. Saturday is steak night. I tried changing it once and I will not do that again. Lunch runs a few minutes late now and then. Nobody has complained to my face yet."

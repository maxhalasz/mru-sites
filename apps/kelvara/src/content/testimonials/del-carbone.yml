name: "Del Carbone"
order: 2
published: true
role_no: "Hovedkokk, Ødemark A"
role_en: "Chief Cook, Ødemark A"
quote_no: "Jeg har kokkelert i familiens restaurant, på et cruiseskip og på et sykehuskjøkken, og en plattform er det tøffeste publikummet jeg har hatt. Folk jobber tolv timer i kulde og mørke, og et varmt måltid er det de gleder seg mest til. Lørdag er biffkveld, og ingen går glipp av den. Lunsjen kan av og til være noen minutter forsinket. Jeg har fått beskjed om at det er en del av sjarmen."
quote_en: "I've cooked in my family's restaurant, on a cruise ship and in a hospital kitchen, and a platform is the hardest crowd I've had. People work twelve hours in the cold and the dark, and a hot meal is the part of the day they look forward to. Saturday is steak night and nobody misses it. Lunch is sometimes a few minutes late. I'm told that's part of the charm."

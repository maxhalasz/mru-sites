name: "Sofie Aune"
order: 3
published: true
role_no: "Radiooperatør, Ødemark A"
role_en: "Radio Operator, Ødemark A"
quote_no: "Jeg er stemmen på radioen, så før eller siden snakker alle med meg. Helikoptrene og forsyningsbåtene melder seg på gjennom meg, og det gjør mannskapet når noe går galt nede på kjellerdekket. Jeg flyttet mye som barn, og jeg hadde aldri trodd at en plattform i Nordsjøen skulle kjennes som hjemme. Men det gjør den. Folk her merker når man ikke er seg selv. Når man lever så tett på hverandre i så små omgivelser, blir man faktisk glad i fremmede."
quote_en: "I am the voice on the radio, so everybody ends up talking to me sooner or later. The helicopters and the supply boats check in through me, and so does the crew when something goes wrong down on the cellar deck. I moved around a lot as a kid, and I never expected a platform in the North Sea to feel like home. It does, though. People here notice when you are not yourself. Living with them in such a small environment really makes you grow fond of strangers."

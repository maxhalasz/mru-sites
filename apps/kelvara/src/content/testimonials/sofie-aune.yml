name: "Sofie Aune"
order: 3
published: true
role_no: "Radiooperatør, Ødemark A"
role_en: "Radio Operator, Ødemark A"
quote_no: "Jeg er stemmen på radioen, så før eller siden snakker alle med meg. Helikoptrene og forsyningsbåtene melder seg på gjennom meg, og det gjør mannskapet når noe oppstår nede på kjellerdekket. Jeg flyttet mye som barn, og jeg trodde ikke en plattform i Nordsjøen skulle føles som hjemme. Det gjør den, mest fordi folk her passer på hverandre."
quote_en: "I'm the voice on the radio, so sooner or later everyone talks to me. The helicopters and the supply boats call in through me, and so does the crew when something comes up down on the cellar deck. I moved around a lot growing up, and I didn't expect a platform in the North Sea to feel like home. It does, mostly because people here look out for each other."

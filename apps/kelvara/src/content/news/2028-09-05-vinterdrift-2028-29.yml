date: "2028-09-05"
published: true
title_no: "Vinterdrift 2028/29 på Ødemark A"
title_en: "Winter operations 2028/29 on Ødemark A"
summary_no: "Fra 1. november går Ødemark A over til vinterplan med lang rotasjon og Kelvaras rutiner for mørketid."
summary_en: "From 1 November, Ødemark A moves to its winter schedule with a long rotation and Kelvara's routines for the dark season."
body_no: |-
  Fra 1. november går Ødemark A over til vinterplan. Mannskapet signerer på for hele sesongen frem til våren, fordi været i det nordlige Norskehavet gjør regelmessige mannskapsbytter og forsyningsturer usikre i vintermånedene. Forsyningsturer fortsetter fra Ågotnes når været tillater det, og helikoptertransport er begrenset til medisinske og operative behov.

  Gjennom de mørkeste ukene følger installasjonen Kelvaras Mørketid-rutiner, med faste tider for dagslyslamper, jevnlig kontakt med familie på land og tett oppfølging fra installasjonens lege. Familier kan når som helst i sesongen ta kontakt med Kelvaras kontaktgruppe på land.
body_en: |-
  From 1 November, Ødemark A moves to its winter schedule. Crew sign on for the full season until spring, since weather in the northern Norwegian Sea makes regular crew changes and supply runs uncertain over the winter months. Supply runs continue from Ågotnes when the weather allows, and helicopter transfers are limited to medical and operational needs.

  Through the darkest weeks the installation follows Kelvara's Mørketid routines, with fixed daylight-lamp schedules, regular contact with families onshore and close follow-up from the installation medic. Families can reach Kelvara's onshore contact team at any hour during the season.

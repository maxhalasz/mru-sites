date: "2028-08-18"
published: true
title_no: "Kelvara er hovedsponsor for redningsskøyta RS «Sotrabuen»"
title_en: "Kelvara becomes main sponsor of the rescue vessel RS «Sotrabuen»"
summary_no: "Støtten går til Redningsselskapets frivillige mannskap og drift av RS 138 «Sotrabuen»."
summary_en: "The support goes to the volunteer crew and operation of the Norwegian Society for Sea Rescue vessel RS 138 «Sotrabuen»."
body_no: |-
  Kelvara har inngått en treårig avtale om å være hovedsponsor for redningsskøyta RS 138 «Sotrabuen», som drives av Redningsselskapet med frivillig mannskap. Støtten går til opplæring, utstyr og drift.

  – Vi arbeider på havet, og vi vet hva det betyr at noen kommer når noe skjer. Det er en rolle vi vil bidra til å holde i gang, sier Siri Østrem, finansdirektør i Kelvara.
body_en: |-
  Kelvara has signed a three-year agreement to be the main sponsor of the rescue vessel RS 138 «Sotrabuen», operated by the Norwegian Society for Sea Rescue with a volunteer crew. The support goes to training, equipment and operation.

  "We work at sea, and we know what it means that someone comes when something happens. It is a service we want to help keep going," says Siri Østrem, CFO of Kelvara.

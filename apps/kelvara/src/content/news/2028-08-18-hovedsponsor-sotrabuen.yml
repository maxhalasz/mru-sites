date: "2028-08-18"
published: true
title_no: "Kelvara er hovedsponsor for redningsskøyta RS «Sotrabuen»"
title_en: "Kelvara becomes main sponsor of the rescue vessel RS «Sotrabuen»"
summary_no: "Støtten går til opplæring, utstyr og drift av RS 138 «Sotrabuen», som drives av frivillige."
summary_en: "The money goes to training, equipment and operation of RS 138 «Sotrabuen», crewed by volunteers."
body_no: |-
  Kelvara har inngått en treårig avtale om å være hovedsponsor for redningsskøyta RS 138 «Sotrabuen». Skøyta drives av Redningsselskapet med frivillig mannskap, og støtten går til opplæring, utstyr og drift.

  – Vi arbeider på havet, og vi vet hva det betyr at noen kommer når noe skjer. Det vil vi være med på å holde i gang, sier Siri Østrem, finansdirektør i Kelvara.
body_en: |-
  Kelvara has signed a three-year agreement to be main sponsor of the rescue vessel RS 138 «Sotrabuen». The vessel is run by the Norwegian Society for Sea Rescue with a volunteer crew, and the money goes to training, equipment and operation.

  "We work at sea, and we know what it means when someone comes after you. We want to help keep that going," says Siri Østrem, CFO of Kelvara.

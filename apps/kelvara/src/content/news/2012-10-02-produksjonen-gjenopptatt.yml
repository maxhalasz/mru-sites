date: "2012-10-02"
published: true
title_no: "Produksjonen på Ødemark A er gjenopptatt"
title_en: "Production on Ødemark A has resumed"
summary_no: "Etter oppgradering og ombygging produserer Ødemark A igjen."
summary_en: "After upgrade and refurbishment, Ødemark A is producing again."
body_no: "Produksjonen på Ødemark A er gjenopptatt etter oppgradering og ombygging av topside. Plattformen drives med en liten bemanning."
body_en: "Production on Ødemark A has resumed after upgrade and refurbishment of the topside. The platform is operated with a lean crew."

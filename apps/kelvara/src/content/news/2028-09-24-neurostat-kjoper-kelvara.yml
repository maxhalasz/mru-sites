date: "2028-09-24"
published: true
title_no: "NeuroStat Holding AG kjøper Kelvara Petrochemicals AS"
title_en: "NeuroStat Holding AG acquires Kelvara Petrochemicals AS"
summary_no: "NeuroStat Holding AG har kjøpt alle aksjene i Kelvara fra Sundvor Partners AS. Kelvara fortsetter som selvstendig operatør."
summary_en: "NeuroStat Holding AG (SIX: NEUS) has acquired all shares in Kelvara from Sundvor Partners AS. Kelvara continues as an independent operator."
body_no: |-
  Stavanger, 24. september 2028. NeuroStat Holding AG (SIX: NEUS) har kjøpt 100 prosent av aksjene i Kelvara Petrochemicals AS fra Sundvor Partners AS. Kelvara blir et heleid datterselskap i NeuroStat-konsernet. Transaksjonen ble gjennomført i dag. Finansielle vilkår offentliggjøres ikke.

  Kelvara fortsetter som selvstendig operatør under eget navn, med hovedkontor i Stavanger og forsyningsbase og væskeanlegg på Ågotnes. Ledelsen og organisasjonen offshore og onshore er uendret. Ødemark A fortsetter normal drift, og vinterrotasjonen fra 1. november gjennomføres som planlagt.

  – Sundvor Partners stiftet Kelvara i 2011 for å gi Ødemark A et nytt liv. Med NeuroStat som eier har vi en langsiktig partner med sterk interesse for trygg drift og for menneskene som arbeider offshore, sier Eirik Sandvold, administrerende direktør i Kelvara Petrochemicals.

  NeuroStat og Kelvara har samarbeidet siden 2027, da Ødemark A ble studiested i NeuroStats forskning på helse og kognitiv ytelse i offshorearbeid på høy breddegrad.

  – Ødemark A er en godt drevet installasjon med et erfarent mannskap. Vi ser frem til å støtte Kelvaras drift og menneskene der, sier Marcus Holt, Head of Clinical Field Operations i NeuroStat.

  Om Kelvara. Kelvara Petrochemicals AS er et norsk olje- og gasselskap med hovedkontor i Stavanger. Selskapet driver installasjonen Ødemark A i det nordlige Norskehavet og et væskeanlegg for borevæsker på Ågotnes. Kelvara har vært en del av NeuroStat-konsernet siden september 2028.
body_en: |-
  Stavanger, 24 September 2028. NeuroStat Holding AG (SIX: NEUS) has acquired 100 percent of the shares in Kelvara Petrochemicals AS from Sundvor Partners AS. Kelvara becomes a wholly owned subsidiary of the NeuroStat group. The transaction was completed today. Financial terms are not disclosed.

  Kelvara will continue as an independent operator under its own name, with its head office in Stavanger and its supply base and fluids plant at Ågotnes. Management and the organisation offshore and onshore remain unchanged. Ødemark A continues normal operations, and the winter rotation from 1 November goes ahead as planned.

  "Sundvor Partners founded Kelvara in 2011 to give Ødemark A a second life. With NeuroStat as owner, we have a long-term partner with a strong interest in safe operations and in the people who work offshore," says Eirik Sandvold, CEO of Kelvara Petrochemicals.

  NeuroStat and Kelvara have worked together since 2027, when Ødemark A became a study site in NeuroStat's research on health and cognitive performance in high-latitude offshore work.

  "Ødemark A is a well-run installation with an experienced crew. We look forward to supporting Kelvara's operations and its people," says Marcus Holt, Head of Clinical Field Operations at NeuroStat.

  About Kelvara. Kelvara Petrochemicals AS is a Norwegian oil and gas company headquartered in Stavanger. It operates the Ødemark A installation in the northern Norwegian Sea and a drilling fluids plant at Ågotnes. Kelvara has been part of the NeuroStat group since September 2028.

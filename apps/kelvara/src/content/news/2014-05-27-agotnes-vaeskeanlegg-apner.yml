date: "2014-05-27"
published: true
title_no: "Ågotnes Væskeanlegg er åpnet"
title_en: "Ågotnes Væskeanlegg opens"
summary_no: "Anlegget for borevæsker ved forsyningsbasen på Ågotnes er tatt i bruk."
summary_en: "The drilling fluids plant at the supply base at Ågotnes has entered service."
body_no: "Ågotnes Væskeanlegg, Kelvaras anlegg for blanding og lagring av borevæsker, er åpnet ved forsyningsbasen på Ågotnes. Anlegget leverer til Ødemark A og til andre operatører."
body_en: "Ågotnes Væskeanlegg, Kelvara's plant for mixing and storing drilling fluids, has opened at the supply base at Ågotnes. The plant supplies Ødemark A and other operators."

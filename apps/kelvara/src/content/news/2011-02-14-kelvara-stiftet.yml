date: "2011-02-14"
published: true
title_no: "Sundvor Partners stifter Kelvara Petrochemicals AS"
title_en: "Sundvor Partners founds Kelvara Petrochemicals AS"
summary_no: "Selskapet stiftes for å kjøpe og reaktivere Ødemark A."
summary_en: "The company is founded to buy and reactivate Ødemark A."
body_no: "Sundvor Partners AS har stiftet Kelvara Petrochemicals AS, et selskap med formål å kjøpe og reaktivere plattformen Ødemark A. Hovedkontoret blir i Stavanger."
body_en: "Sundvor Partners AS has founded Kelvara Petrochemicals AS, a company set up to buy and reactivate the Ødemark A platform. The head office will be in Stavanger."

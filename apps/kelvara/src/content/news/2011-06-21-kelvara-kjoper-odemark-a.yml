date: "2011-06-21"
published: true
title_no: "Kelvara kjøper Ødemark A"
title_en: "Kelvara acquires Ødemark A"
summary_no: "Selskapet overtar plattformen for å reaktivere den."
summary_en: "The company takes over the platform in order to reactivate it."
body_no: "Kelvara Petrochemicals AS har kjøpt plattformen Ødemark A i det nordlige Norskehavet. Planen er å oppgradere og ta plattformen i bruk igjen."
body_en: "Kelvara Petrochemicals AS has bought the Ødemark A platform in the northern Norwegian Sea. The plan is to upgrade the platform and put it back in service."

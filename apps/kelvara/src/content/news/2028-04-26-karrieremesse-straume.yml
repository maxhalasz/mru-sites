date: "2028-04-26"
published: true
title_no: "Kelvara på karrieremesse på Straume vidaregåande skule"
title_en: "Kelvara at the careers fair at Straume vidaregåande skule"
summary_no: "Kelvara møtte elever og lærlinger som vurderer en fagkarriere innen olje og gass."
summary_en: "Kelvara met students and apprentices considering a technical career in oil and gas."
body_no: "Kelvara deltok på karrieremessen på Straume vidaregåande skule, der elever og lærlinger fikk snakke med ansatte fra Ødemark A og fra basen på Ågotnes. Kelvara tar inn lærlinger i flere fag hvert år."
body_en: "Kelvara took part in the careers fair at Straume vidaregåande skule, where students and apprentices spoke with employees from Ødemark A and from the base at Ågotnes. Kelvara takes on apprentices in several trades every year."

title_no: "Kelvara på karrieremesse på Straume vidaregåande skule"
title_en: "Kelvara at the careers fair at Straume vidaregåande skule"
summary_no: "Kelvara møtte elever og lærlinger som vurderer fagarbeid i olje og gass."
summary_en: "Kelvara met students and apprentices who are considering trade work in oil and gas."
body_no: "Kelvara var med på karrieremessen på Straume vidaregåande skule. Elever og lærlinger fikk snakke med folk fra Ødemark A og fra basen på Ågotnes. Kelvara tar inn lærlinger i flere fag hvert år."
body_en: "Kelvara took part in the careers fair at Straume vidaregåande skule, where students and apprentices spoke with people from Ødemark A and from the base at Ågotnes. Kelvara takes on apprentices in several trades every year."

date: "2028-02-09"
published: true
title_no: "Havtil godkjenner forlenget levetid for Ødemark A"
title_en: "Havtil approves life extension for Ødemark A"
summary_no: "Havindustritilsynet har samtykket til at Ødemark A kan brukes til og med 2038."
summary_en: "The Norwegian Ocean Industry Authority (Havtil) has consented to use of Ødemark A through 2038."
body_no: |-
  Havindustritilsynet (Havtil) har gitt Kelvara samtykke til å bruke Ødemark A til og med 2038. Samtykket bygger på en omfattende vurdering av betongstrukturen, undervannsinspeksjoner og vedlikeholdsprogrammet de siste årene.

  – Samtykket er resultatet av grundig arbeid i mange år, og det viser at plattformen er i god stand, sier Lars Kvamme, driftsdirektør i Kelvara.
body_en: |-
  The Norwegian Ocean Industry Authority (Havtil) has given Kelvara consent to use Ødemark A through 2038. The consent is based on a thorough assessment of the concrete structure, subsea inspections and the maintenance programme of recent years.

  "The consent is the result of many years of careful work, and it shows that the platform is in good condition," says Lars Kvamme, COO of Kelvara.

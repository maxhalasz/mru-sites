<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />

<body class="locked">
  <div id="stage"><input id="keys" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="." />

    <input id="keyask" type="password" hidden autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="." />

  <main id="app">
    <section id="panel-view" hidden>
      <header class="top">

          <button class="btn" id="reload-all" type="button" title="Faz todas as páginas abertas dos sites recarregarem agora">Recarregar todas as páginas</button>
          <button class="btn ghost" id="sign-out" type="button">Trancar</button>
        </div>
      </header>
      <p id="toast" class="toast" role="status" hidden></p>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Seções"></nav>
      <div id="tab-body"></div>
    </section>
  </main>
  <script src="painel.js"></script>
